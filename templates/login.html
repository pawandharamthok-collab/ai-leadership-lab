<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive AI Assistant | Authenticated Vault Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F19;
      --card: #111827;
      --border: #1F293D;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --accent-rose: #F43F5E;
      --accent-emerald: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 50%);
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .vault-icon {
      font-size: 42px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #FFF;
      margin-bottom: 8px;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 13.5px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .passcode-input {
      width: 100%;
      background: #0B0F19;
      border: 1px solid var(--border);
      color: #FFF;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 6px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: all 0.2s ease;
    }
    .passcode-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }
    .error-msg {
      color: var(--accent-rose);
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 14px;
      display: none;
    }
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--accent-emerald);
      margin-top: 24px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="vault-icon">🔐</div>
    <h1>Executive Assistant Vault</h1>
    <p class="sub">Air-Gapped Autonomous Advisory Fleet<br>Please enter your Master Passcode to unlock.</p>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="input-group">
        <label class="input-label" for="passcode">Master Access Passcode</label>
        <input type="password" id="passcode" class="passcode-input" placeholder="••••" autofocus required>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Unlock Executive Assistant ➔</button>
      <div id="errorMsg" class="error-msg">⚠️ Invalid Passcode. Access Denied.</div>
    </form>

    <div>
      <span class="security-badge">
        <span>🛡️</span> Zero-Trust End-to-End Encrypted Session
      </span>
    </div>
  </div>

  <script>
    async function handleAuth(e) {
      e.preventDefault();
      const input = document.getElementById("passcode");
      const errorMsg = document.getElementById("errorMsg");
      const submitBtn = document.getElementById("submitBtn");
      
      errorMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerText = "Verifying Vault...";

      try {
        const res = await fetch("/api/verify_passcode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passcode: input.value.trim() })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = "/";
        } else {
          errorMsg.innerText = data.error || "⚠️ Invalid Passcode. Access Denied.";
          errorMsg.style.display = "block";
          input.value = "";
          input.focus();
        }
      } catch (err) {
        errorMsg.innerText = "Network error verifying passcode.";
        errorMsg.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Unlock Executive Assistant ➔";
      }
    }
  </script>
</body>
</html>
