version: '3.8'

services:
  assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-leadership-lab:latest
    container_name: ai_leadership_assistant
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_PATH=/data/memory.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - ZERODHA_API_KEY=${ZERODHA_API_KEY}
      - ZERODHA_API_SECRET=${ZERODHA_API_SECRET}
      - ZERODHA_ACCESS_TOKEN=${ZERODHA_ACCESS_TOKEN}
    volumes:
      # Data persistence mount: keeps memory.db resilient and decoupled from container updates
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
