name: Cloud Run Deployment & Disaster Recovery

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: ai-leadership-assistant
  REGION: us-central1

jobs:
  deploy-cloud-run:
    name: Deploy to Google Cloud Run (Always Free Tier)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      if: env.PROJECT_ID != ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud SDK
      if: env.PROJECT_ID != ''
      uses: google-github-actions/setup-gcloud@v2

    - name: Build & Deploy Container to Cloud Run
      if: env.PROJECT_ID != ''
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --min-instances 0 \
          --max-instances 1 \
          --memory 512Mi \
          --cpu 1 \
          --set-env-vars "APP_ENV=production,PORT=8080" \
          --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest"
